name = "board-game-catalog"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The public hostname, one of three catalogues under heygabi.ai (the others are
# audiobooks and library). `custom_domain = true` makes the deploy create the
# hostname and its DNS record, which is why this line — not a dashboard click —
# is what puts the site online.
#
# ⚠️ No CF_ACCESS_AUD change accompanies this, and that is deliberate rather
# than forgotten. This hostname was added as a second *destination* on the
# existing `board-game-catalog` Access application instead of as a new
# application, so it inherits that app's audience — already the first entry in
# CF_ACCESS_AUD below — and its Production policy. A new application would have
# minted a third AUD that had to be appended here.
#
# The workers.dev URL is kept: it is the second AUD's destination and still the
# fallback if this record is ever wrong.
[[routes]]
pattern = "boardgames.heygabi.ai"
custom_domain = true

# The built React PWA. Static files are served directly; anything that isn't a
# file falls through to the Worker, which serves index.html for SPA routes.
# Run `npm run build` at the repo root before `wrangler dev` or `deploy`.
[assets]
directory = "../web/dist"
binding = "ASSETS"

# Per-IP throttle on the unauthenticated surface — see middleware/rate-limit.ts.
#
# Required by PLATFORM.md §4.1 before Cloudflare Access came off: with Access in
# front, only allowlisted people could reach the Worker at all. Now anyone can,
# and a request that fails token verification still costs the CPU of trying.
#
# 300 per 60s is an anti-abuse floor, not a quota. The collection page fans out
# roughly a dozen calls, and both household members can share one IP, so the
# ceiling is set well above anything ordinary use produces.
#
# ⚠️ `period` accepts only 10 or 60 — any other value is rejected at deploy.
# ⚠️ `namespace_id` is an arbitrary string, but changing it silently resets
# every counter, so leave it alone.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "board-game-catalog"
# Created 2026-08-04 in region WNAM.
database_id = "7dd22702-f0e2-4fc7-b201-d16d60176efa"
# Migrations live at the repo root so the CLI can reach them too.
migrations_dir = "../../migrations"

# Scan photos are still never stored — they go from the upload request straight
# into the vision call and are gone. This bucket is a SEPARATE thing: rehosted
# game covers, ported from library_catalog's `library-covers` pattern
# (docs/access/cloudflare.md §7.1) and named on the same `<word>covers.
# heygabi.ai` precedent as `covers.heygabi.ai` (audiobook) and
# `bookcovers.heygabi.ai` (library). One bucket per catalog, not shared — see
# catalog-platform/docs/info/covers-consolidation-plan.md §2.1 for why.
[[r2_buckets]]
binding = "COVERS"
bucket_name = "game-covers"

# Cover-image health, checked in slices.
#
# Every thumbnail_url is a hotlink to BoardGameGeek, Kickstarter or Gamefound,
# and none of them owe us a stable URL. One invocation cannot probe the whole
# catalog — Workers cap subrequests — so this walks it oldest-checked-first, 20
# URLs at a time. Every half hour is ~960 probes a day against ~450 distinct
# covers: roughly two full passes, which is often enough to notice a CDN change
# within a day and rare enough to be a rounding error in anyone's traffic.
#
# And weekly, what BoardGameGeek says exists for the games we own.
#
# This is the half of "what am I missing" that cannot be got by remembering: a
# publisher announces an expansion for a game on the shelf and it appears in the
# missing list with nobody doing anything. 83 rooted games with a `bgg_id` cost
# 5 requests and ~6 seconds to re-sweep, so weekly is a rounding error.
#
# 05:41 UTC on day-of-week 1. Cloudflare's dashboard renders that as **Sunday**,
# not Monday — an earlier version of this comment said Monday and was wrong.
# Which day it lands on does not matter; do not "fix" the expression to chase the
# comment. Minute 41 keeps it off :00 and :30, where the cover check
# lives — two cron invocations in the same minute would compete for the same
# subrequest budget. The handler in src/index.ts dispatches on the expression,
# so **this string must match COMPONENT_REFRESH_CRON in
# src/lib/component-backfill.ts character for character.**
[triggers]
# "7 * * * *" — the hourly missing-details sweep (owner ask 2026-08-16).
# ⚠️ This string is matched in scheduled() via DETAILS_SWEEP_CRON; change
# both or the sweep silently stops firing and nothing reports it.
crons = ["*/30 * * * *", "41 5 * * 1", "7 * * * *"]

[vars]
APP_VERSION = "0.1.0"
ENVIRONMENT = "production"

# Where a rehosted cover object resolves — the `game-covers` R2 bucket's custom
# domain (see the [[r2_buckets]] binding above), on the same
# `<word>covers.heygabi.ai` precedent as the two sibling catalogs.
# "both, or neither": a route reading COVERS without this set is a
# misconfiguration, not a fallback to a hotlink.
COVERS_BASE_URL = "https://gamecovers.heygabi.ai"

# The shared index Worker (catalog-platform/apps/index-worker) — deliberately
# NOT set yet. That Worker is undeployed until the owner answers its read-auth
# question (index-worker-design.md §9 Q3); until then every push trigger in
# lib/index-push.ts logs one line and does nothing, by design. When it goes
# live, set the URL here and the token as a secret:
#   npx wrangler secret put INDEX_PUSH_TOKEN   (= the index's INDEX_PUSH_TOKEN_GAME)
# Went live 2026-08-13 (reads members-only, so the gate that held this is
# answered); the token was set the same day.
INDEX_URL = "https://index.heygabi.ai"

# The recovery hatch. Any email listed here is forced to `owner` when it signs
# in, regardless of what its app_user row says.
#
# It was deliberately empty while Cloudflare Access stood in front, because
# Access was itself the way back in: locked out of the app, you were still on
# the allowlist and could edit the database. ⚠️ Access was deleted 2026-08-10,
# so that fallback is gone and this is now the only route back to `owner`
# without hand-editing D1.
#
# There are two owners (`nbaslamking@gmail.com` and `asprint200@gmail.com`);
# only the first is listed, per the owner's instruction. Add the second as a
# comma-separated value if you want either to be able to self-recover.
OWNER_EMAILS = "nbaslamking@gmail.com"

# Estate auth (catalog-platform/docs/info/estate-auth-design.md, adopted per
# §14.5 — shadow-first).
#
# ⚠️ ESTATE_CHECK IS "enforce" — see the value two lines below. The §3.1
# verdicts act: revoked → 403, unreachable with no local standing → a named
# 503, default-grant assigns `guest`. Any unrecognised value behaves as "off"
# and complains in the log.
#
# ⚠️ This comment said the flag was *"deliberately 'off' in the committed file
# … must be inert until the owner flips it"* for as long as the line below it
# has read `enforce` — corrected 2026-08-26 (defect 3 of 3 in
# catalog-platform/docs/info/llm-billing-control-design.md §6.1). A comment
# that contradicts the line it sits on is worse than no comment: this one told
# a reader the games Worker's estate check was inert, three lines above the
# flag that has it enforcing, so anyone reasoning about who this Worker refuses
# got the answer exactly backwards. It is also the shape the estate audit
# already named — a flag gets flipped, the sweep updates three places, and the
# missed copy is ALWAYS a comment or a README, never code.
#
# The rollout order is kept, because it is how the NEXT surface adopts this and
# how this one would roll back: ship inert at "off" → "shadow" (the full check
# runs and LOGS the §3.1 would-verdict, changes no response; `npm run tail
# --workspace @bgc/worker` and grep for WOULD-DENY, expect zero for household
# members) → only after days of clean shadow logs, "enforce".
#
# The check also needs its bearer:
#   npm run secret ESTATE_APP_TOKEN_GAMES
# (the same value the auth Worker already holds under that name). URL and flag
# live here; the token never does — this file is committed. With the secret or
# URL absent, shadow/enforce log `config unset` per request and skip the check.
ESTATE_CHECK = "enforce"
ESTATE_AUTH_URL = "https://auth.heygabi.ai"

# ── SPENDING POLICY (lib/billing-gate.ts, phase 3, 2026-09-02) ───────────────
#
# ⚠️ BILLING_POLICY IS "off" — see the value at the foot of this block.
#
# Which money paths on the `games` site may bill the model, decided by the
# owner from the Spending panel on https://heygabi.ai/admin/ and delivered on
# the /seen answer this Worker already makes. Design:
# catalog-platform/docs/info/llm-billing-control-design.md §4.
#
#   off      nothing resolves, nothing is logged, nothing costs — TODAY
#   shadow   the decision is logged with `proceeded`, and the call bills anyway
#   enforce  a denied path is refused, in words
#
# 🔴 THIS IS NOT ESTATE_CHECK, and the two values above and below are allowed
# to differ. `ESTATE_CHECK` answers *"is this person still a member"* and is
# already at `enforce`; this one answers *"may this person spend"* and has
# never run. Reading one as licence to flip the other is the mistake this
# paragraph exists to prevent.
#
# ⚠️ It ships `off` and MUST. Flipping is the evidence-gated step, §4.2, and
# BOTH halves of the criterion must hold over >= 7 days: ZERO `"would_deny":true`
# on a feature the owner did not switch off, AND AT LEAST ONE on a feature he
# did — the second half is what makes the first falsifiable rather than
# indistinguishable from an instrument that never ran. That is exactly the
# `0 of 0 — unmeasured, not clean` verdict the audiobook auth soak reached.
#
#   npm run tail --workspace @bgc/worker   # then grep '"evt":"billing_policy"'
#
# ⚠️ Never flip as a side effect of an unrelated deploy.
# `apps/worker/src/lib/billing-gate.test.ts` reads this file and fails unless
# the value below is "off", so the flip has to be a deliberate commit.
BILLING_POLICY = "off"

# The Firebase project whose ID tokens middleware/auth.ts accepts, pinned as
# both `iss` and `aud`.
#
# ⚠️ Must match `projectId` in apps/web/src/lib/firebase.ts or every request
# 401s. It is deliberately the SAME project as the audiobook and library
# catalogs: one Google account is one person across all three, which is the
# reason this catalog moved off Cloudflare Access.
FIREBASE_PROJECT_ID = "audiobook-catalog"

# ⚠️ DEPRECATED — Access no longer authenticates this Worker; auth.ts verifies
# Firebase ID tokens. These two stay ONLY until the Access application is
# deleted, which is the last step of the cutover rather than the first: Access
# stays in front while the token path is proved on the live host. Delete these
# two lines and the matching fields in src/env.ts together, once it is gone.
#
# Both values came from the "This Worker URL requires Access sign-in" dialog.
# CF_ACCESS_AUD is a comma-separated list because Cloudflare mints a separate
# Access application per URL: the first audience below is the production URL,
# the second is the preview (*-board-game-catalog) URL.
CF_ACCESS_TEAM_DOMAIN = "wispy-snowflake-2801.cloudflareaccess.com"
CF_ACCESS_AUD = "65e61dbe36fd4482fab983072ad4365d1d4cabe4492e29cfb492b1f67d5f14c6,bd08ade937830541f55725ecf12ae2d02d88c5d647851b6b6a50f1d4239add2b"
