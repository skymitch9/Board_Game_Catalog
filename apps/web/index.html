<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser chrome above the page, which on a phone is a visible band
         of colour touching the design. Set from JS below rather than by a
         media query, because the user's own choice has to win over the OS —
         and a `media` attribute here cannot see `data-theme`. Keep the values
         in step with `--paper` in styles.css; they cannot read a CSS variable. -->
    <meta name="theme-color" content="#f2e8d5" />
    <!--
      Theme, resolved before the first paint.

      ⚠️ This is inline and blocking on purpose. Left to React it would run
      after the first paint, and every load in dark mode would flash cream for
      a frame — which is worse than having no toggle at all, and is the single
      most common way a theme switcher is got wrong.

      It always writes an explicit `light` or `dark` onto <html>, resolving
      "system" here rather than in CSS. That is what lets styles.css define the
      dark palette exactly once, under `:root[data-theme="dark"]`, instead of
      duplicating it for the media-query case. A no-JS fallback would be
      pointless: this app renders nothing without JS.

      Kept in sync with `apps/web/src/lib/theme.ts` — the key and the values are
      the contract between the two.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bgc-theme');
          var choice = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* Private mode can throw on localStorage. Light is the default. */
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>Board Game Catalog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
